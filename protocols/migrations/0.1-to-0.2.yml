schema: axis.protocol_migration
schema_version: 1
from_version: "0.1"
to_version: "0.2"
operations:
  - op: copy
    from: project.slug
    to: project.slug
  - op: copy
    from: project.display_name
    to: project.display_name
  - op: copy
    from: package.outbox_dir
    to: package.outbox_dir
  - op: copy
    from: release.channel
    to: release.channel
  - op: copy
    from: release.gate
    to: release.gate
  - op: copy
    from: oss.provider
    to: oss_profile.provider
  - op: copy
    from: oss.bucket
    to: oss_profile.bucket
  - op: copy
    from: oss.prefix
    to: oss_profile.prefix
  - op: copy
    from: oss.endpoint_env
    to: oss_profile.endpoint_env
  - op: copy
    from: oss.region_env
    to: oss_profile.region_env
  - op: copy
    from: oss.access_key_id_env
    to: oss_profile.access_key_id_env
  - op: copy
    from: oss.access_key_secret_env
    to: oss_profile.access_key_secret_env
  - op: copy
    from: oss.security_token_env
    to: oss_profile.security_token_env
  - op: copy
    from: local.outbox_dir
    to: local.outbox_dir
  - op: copy
    from: local.dry_run
    to: local.dry_run
  - op: copy
    from: local.redaction_patterns_file
    to: local.redaction_patterns_file
  - op: copy
    from: local.environment_name
    to: local.environment_name
  - op: copy
    from: local.oss.endpoint_env
    to: local.oss.endpoint_env
  - op: copy
    from: local.oss.region_env
    to: local.oss.region_env
  - op: copy
    from: local.oss.access_key_id_env
    to: local.oss.access_key_id_env
  - op: copy
    from: local.oss.access_key_secret_env
    to: local.oss.access_key_secret_env
  - op: copy
    from: local.oss.security_token_env
    to: local.oss.security_token_env
  - op: set
    to: contract_version
    value: "0.2"
  - op: prompt
    to: organization.id
    prompt: Select an organization id from the registry.
  - op: prompt
    to: organization.registry
    prompt: Select the organization registry path.
  - op: prompt
    to: oss_profile.name
    prompt: Select an OSS profile from the organization registry.
  - op: drop
    from: local.oss.provider
    reason: Local OSS provider overrides are not supported in 0.2.
  - op: drop
    from: local.oss.bucket
    reason: Local OSS bucket overrides are not supported in 0.2.
  - op: drop
    from: local.oss.prefix
    reason: Local OSS prefix overrides are not supported in 0.2.
  - op: drop
    from: local.inline_target
    reason: Local inline targets are not supported in 0.2.
  - op: drop
    from: local.credential_blob
    reason: Local credential-like values are not supported in 0.2.
